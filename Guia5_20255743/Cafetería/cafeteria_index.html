<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roger's Cafe - Gestión de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" />
    <script src="js/cafeteria.js" defer></script>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Roger's Cafe</h1>
        
        <div class="row g-3 align-items-end mb-4">
            <div class="col-md-4">
                <label for="idProducto" class="form-label">Producto</label>
                <input type="text" id="idProducto" class="form-control" placeholder="Ej. Café americano">
            </div>
            <div class="col-md-3">
                <label for="idPrecio" class="form-label">Precio Unitario ($)</label>
                <input type="number" id="idPrecio" class="form-control" step="0.01" min="0.01" placeholder="0.00">
            </div>
            <div class="col-md-3">
                <label for="idCantidad" class="form-label">Cantidad</label>
                <input type="number" id="idCantidad" class="form-control" min="1" placeholder="1">
            </div>
            <div class="col-md-2">
                <button id="btnAgregar" class="btn btn-cafe w-100">Agregar Pedido</button>
            </div>
        </div>

        <hr>

        <div class="row g-2 align-items-center mb-3 mt-3">
            <div class="col-auto">
                <label for="idPrecioMax" class="col-form-label">Precio Máximo:</label>
            </div>
            <div class="col-auto">
                <input type="number" id="idPrecioMax" class="form-control form-control-sm" step="0.01">
            </div>
            <div class="col-auto">
                <button id="btnFiltrar" class="btn btn-sm btn-outline-cafe">Filtrar productos</button>
            </div>
            <div class="col-auto ms-auto">
                <button id="btnMostrar" class="btn btn-sm btn-outline-secondary">Mostrar todos</button>
                <button id="btnLimpiar" class="btn btn-sm btn-danger">Limpiar pedidos</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover mt-2">
                <thead>
                    <tr>
                        <th scope="col">Producto</th>
                        <th scope="col">Precio unitario</th>
                        <th scope="col">Cantidad</th>
                        <th scope="col">Subtotal</th>
                    </tr>
                </thead>
                <tbody id="tbCuerpoPedidos"></tbody>
            </table>
        </div>

        <div class="totales-box d-flex justify-content-around mt-3">
            <h5 class="mb-0">Total Unidades: <span id="lblUnidades" class="fw-bold">0</span></h5>
            <h5 class="mb-0">Monto Total: <span id="lblMonto" class="fw-bold">$0.00</span></h5>
        </div>
    </div>
</body>
</html>
